[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-protection-platform"
version = "0.1.0"
description = "Virtual battery pack protection logic"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
battery-protection-demo = "battery_platform.manual_observe:main"
