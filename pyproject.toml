[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-protection-lab"
version = "0.1.0"
description = "Virtual battery pack protection logic"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["battery_protection*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
